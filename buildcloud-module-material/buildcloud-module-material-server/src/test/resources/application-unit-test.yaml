--- #################### 筑云相关配置 ####################

# 筑云配置项，设置当前模块所有自定义的配置
yudao:
  info:
    # 取 com.buildcloud（而非某个子包）：基座 @MapperScan 以此为扫描根，
    # material 域当前只有 material 一个顶层域，但保持与主 application.yaml 一致，
    # 后续若再拆顶层域（如 material 内再分独立域）无需再改测试配置
    base-package: com.buildcloud
