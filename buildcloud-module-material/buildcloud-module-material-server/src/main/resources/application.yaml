spring:
  application:
    name: buildcloud-material-server

  profiles:
    active: local

  main:
    allow-circular-references: true # 允许循环依赖，因为项目是三层架构，无法避免这个情况。
    allow-bean-definition-overriding: true # 允许 Bean 覆盖，例如说 Feign 等会存在重复定义的服务

  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yaml # 加载【本地】配置
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml # 加载【Nacos】的配置

  # Servlet 配置
  servlet:
    # 文件上传相关配置项
    multipart:
      max-file-size: 16MB # 单个文件大小
      max-request-size: 32MB # 设置总上传的文件大小

  # Jackson 配置项
  jackson:
    serialization:
      write-dates-as-timestamps: true # 设置 LocalDateTime 的格式，使用时间戳
      write-date-timestamps-as-nanoseconds: false # 设置不使用 nanoseconds 的格式。例如说 1611460870.401，而是直接 1611460870401
      write-durations-as-timestamps: true # 设置 Duration 的格式，使用时间戳
      fail-on-empty-beans: false # 允许序列化无属性的 Bean

  # Cache 配置项
  cache:
    type: REDIS
    redis:
      time-to-live: 1h # 设置过期时间为 1 小时

server:
  port: 48085

logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log # 日志文件名，全路径

--- #################### 接口文档配置 ####################

springdoc:
  api-docs:
    enabled: true # 1. 是否开启 Swagger 接文档的元数据
    path: /v3/api-docs
  swagger-ui:
    enabled: true # 2.1 是否开启 Swagger 文档的官方 UI 界面
    path: /swagger-ui
  default-flat-param-object: true # 参见 https://doc.xiaominfo.com/docs/faq/v4/knife4j-parameterobject-flat-param 文档

knife4j:
  enable: true
  setting:
    language: zh_cn

# MyBatis Plus 的配置项
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 虽然默认为 true ，但是还是显示去指定下。
  global-config:
    db-config:
      id-type: NONE # “智能”模式，基于 IdTypeEnvironmentPostProcessor + 数据源的类型，自动适配成 AUTO、INPUT 模式。
      #      id-type: AUTO # 自增 ID，适合 MySQL 等直接自增的数据库
      #      id-type: INPUT # 用户输入 ID，适合 Oracle、PostgreSQL、Kingbase、DB2、H2 数据库
      #      id-type: ASSIGN_ID # 分配 ID，默认使用雪花算法。注意，Oracle、PostgreSQL、Kingbase、DB2、H2 数据库时，需要去除实体类上的 @KeySequence 注解
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
    banner: false # 关闭控制台的 Banner 打印
  type-aliases-package: ${yudao.info.base-package}.material.dal.dataobject
  encryptor:
    password: ${MYBATIS_ENCRYPTOR_PASSWORD:ChangeMe_Encryptor_Key_2026} # 加解密的秘钥，可使用 https://www.imaegoo.com/2020/aes-key-generator/ 网站生成

mybatis-plus-join:
  banner: false # 关闭控制台的 Banner 打印

# Spring Data Redis 配置
spring:
  data:
    redis:
      repositories:
        enabled: false # 项目未使用到 Spring Data Redis 的 Repository，所以直接禁用，保证启动速度

# VO 转换（数据翻译）相关
easy-trans:
  is-enable-global: false # 【默认禁用，对性能确认压力大】启用全局翻译（拦截所有 SpringMVC ResponseBody 进行自动翻译 )。如果对于性能要求很高可关闭此配置，或通过 @IgnoreTrans 忽略某个接口

--- #################### RPC 远程调用相关配置 ####################

--- #################### MQ 消息队列相关配置 ####################

--- #################### 定时任务相关配置 ####################

xxl:
  job:
    executor:
      appname: ${spring.application.name} # 执行器 AppName
      logpath: ${user.home}/logs/xxl-job/${spring.application.name} # 执行器运行日志文件存储磁盘路径
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token} # 执行器通讯TOKEN

--- #################### 芋道相关配置 ####################

yudao:
  info:
    version: 1.0.0
    base-package: com.buildcloud
  web:
    admin-ui:
      url: http://dashboard.yudao.iocoder.cn # Admin 管理后台 UI 的地址
  xss:
    enable: false
    exclude-urls: # 如下 url，仅仅是为了演示，去掉配置也没关系
      - ${management.endpoints.web.base-path}/** # 不处理 Actuator 的请求
  swagger:
    title: 筑云 - 物料管理
    description: 物料主数据、库存、申领与流水（高并发主战场，spec §5.2）
    version: ${yudao.info.version}
  tenant: # 多租户相关配置项
    enable: true
    ignore-urls: # 无需传递 tenant-id 请求头的 URL（健康探活由运维/网关直接调用，不依赖 system-server）
      - /admin-api/buildcloud-material/health # 健康检查接口

debug: false

--- #################### 筑云相关配置 ####################

# 筑云 BuildCloud — 材料域自定义配置（读取方：com.buildcloud.material.*）
buildcloud:
  material:
    # 申领链路模式（spec v1.2 §6.1「V1/V2 用配置开关切换（同一接口两实现），保证压测可比」）
    #
    # V1 = 行锁同步扣减：同一事务内 SELECT ... FOR UPDATE 锁库存行 → 校验扣减 → 写单据与流水。
    #      这是**压测对照组**，不是要保留的方案（spec §6.1 原文）。W4 只交付 V1。
    # V2 = Redis Lua 预扣 + RocketMQ 事务消息 + 异步落库，W5 交付；当前选到会明确返回
    #      错误码 1-102-070-000（REQUISITION_MODE_NOT_IMPLEMENTED），**绝不静默回退 V1**——
    #      否则 W5 压测会以为在压 V2、实际压的是 V1，对照实验直接失效。
    #
    # 切换方式（压测时不必改仓库文件）：
    #   启动参数：--buildcloud.material.requisition-mode=V2          ← W4-P4 已实测生效
    #   环境变量：BUILDCLOUD_MATERIAL_REQUISITION_MODE=V2
    #   Nacos   ：buildcloud-material-server-local.yaml 追加同名键
    #
    # 关于"Nacos 改了是否要重启"（**未实测，不要当结论用**）：
    #   工厂每次调用都读 Environment（不缓存 @Value），Spring Cloud Alibaba 把 Nacos 变更写回
    #   Environment 后下一次请求即可读到新值——这是设计意图，但 W4-P4 只实测了启动参数这条路径。
    #   W5 压测前请先用「改 Nacos → 看 factory 日志/看 submit 行为」验证一次再下结论。
    # 未配置时按 V1 处理（删掉本行也能跑）。
    requisition-mode: V1

    # 库存对账（spec v1.2 §6.1 步骤⑦；读取方 com.buildcloud.material.framework.job.config.ReconcileProperties）
    #
    # 调度入口有两处：
    #   ① XXL-Job `stockReconcileJob`（生产常态，路由策略=分片广播，按 projectId % shardTotal 分片）；
    #   ② 手动触发接口 POST /admin-api/buildcloud-material/stock/reconcile/trigger（admin，
    #      权限 material:stock:reconcile）——local 下 xxl.job.enabled=false，执行器不注册，
    #      **只有这条路径能真跑**（见 StockReconcileJob 类注释的说明）。
    reconcile:
      # 差异条数 > 该值才告警。默认 0 = 有任何差异就告警（用「>」而不是「>=」的理由见 ReconcileProperties）
      alert-threshold: 0
      # 修复总闸：false = 只检测/落快照/告警，一律不动 Redis 与 DB（排障止血用）
      fix-enabled: true
      # 站内信接收人（system_users.id，逗号分隔）。**留空 = 只打 error 日志、不发站内信**（明确降级）
      # 本地不写字面量：通过环境变量 RECONCILE_ALERT_USER_IDS 注入，或直接在本地未跟踪配置里改
      alert-user-ids: ${RECONCILE_ALERT_USER_IDS:}
      # 站内信模板编号（基座 system_notify_template.code；默认用基座自带通用模板 USER_SEND）
      notify-template-code: ${RECONCILE_NOTIFY_TEMPLATE:USER_SEND}
