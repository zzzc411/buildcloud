# =============================================================================
# 筑云 BuildCloud — 本地中间件编排（W1 Phase 1）
# 计划：docs/plans/plan-w1-infra-up.md Phase 1（中间件 docker-compose 编排）
#
# 版本基线依据（与基座 yudao-cloud master-jdk17 对齐，均有出处）：
#   - 基座 README「框架版本表」：Nacos 3.0.3 / RocketMQ 5.3.1 / Seata 2.5.0 / XXL-Job 2.4.0
#   - 基座官方编排 script/docker-compose/docker-compose.yml：mysql:8.4 / redis:7.4-alpine
#     / nacos/nacos-server:v3.0.3（本文件沿用相同镜像 tag）
#   - 业务库名 ruoyi-vue-pro：基座 application-dev.yaml 与官方 compose 完全一致
#   - MinIO：⚠ 阻塞记录（2026-11-25）：MinIO 官方镜像已停止匿名分发——Docker Hub minio/minio
#     仓库 404，quay.io/minio/minio 匿名拉取 401（实测 latest / RELEASE.2025-09-06 /
#     RELEASE.2025-09-07 均拒），ghcr.io 无公开镜像。技术选型按 spec §3.3 保留 MinIO 不变，
#     服务定义暂以 compose profile「minio」门控：镜像源问题解决（官方恢复 / 私有凭据 /
#     或经 ADR 决议替换方案）后用 `docker compose --profile minio up -d minio` 启用，
#     裁决权在主控（R-4：替换存储组件属不可逆决策，不在本 Phase 擅自变更）。
#   - PostgreSQL+pgvector：pgvector/pgvector:0.8.7-pg17（Spring AI 向量库，W7 使用）
#
# 约束：
#   - R-1 密钥零提交：所有密码/令牌均为 ${VAR} 占位，真实值在 docker/.env（不入库，
#     模板见同目录 .env.template，已被 .gitignore 忽略）
#   - 宿主机端口默认绑定 127.0.0.1（不暴露局域网），默认值与基座 application-dev.yaml
#     的本地开发默认地址对齐；冲突时在 .env 覆盖对应 *_HOST_PORT
#   - 每容器 mem_limit + 健康检查 + depends_on 启动顺序；内存预算见 docs/ops/middleware-limits.md
# =============================================================================

name: buildcloud-middleware

x-default-tz: &tz
  TZ: ${TZ:-Asia/Shanghai}

services:
  # ---------------------------------------------------------------- 基础层 --
  # MySQL 8.4：基座业务库 + D18 分片预留库 pm_log_0..3 + xxl_job（官方建表 SQL）
  mysql:
    image: mysql:8.4
    container_name: bc-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      <<: *tz
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先复制 docker/.env.template 为 docker/.env 并填写 MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-yudao}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 docker/.env 填写 MYSQL_PASSWORD}
      XXL_JOB_DB_USER: ${XXL_JOB_DB_USER:-xxl_job}
      XXL_JOB_DB_PASSWORD: ${XXL_JOB_DB_PASSWORD:?请在 docker/.env 填写 XXL_JOB_DB_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: ./mysql/init/01-create-databases.sql
        target: /docker-entrypoint-initdb.d/01-create-databases.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./mysql/init/02-grants.sh
        target: /docker-entrypoint-initdb.d/02-grants.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./xxl-job/init/tables_xxl_job.sql
        target: /docker-entrypoint-initdb.d/03-tables_xxl_job.sql
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 1500m
    healthcheck:
      # 首次初始化时 MySQL 临时实例不监听 TCP，127.0.0.1 可连通即表示初始化完成
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    container_name: bc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请在 docker/.env 填写 REDIS_PASSWORD}"]
    environment:
      <<: *tz
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Nacos 3.0.3 单机（嵌入式存储），注册中心 + 配置中心；本地未开启鉴权，
  # 端口仅绑定 127.0.0.1。v3 控制台独立端口 8080，主端口 8848，gRPC 9848（= HTTP+1000）
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: bc-nacos
    restart: unless-stopped
    environment:
      <<: *tz
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      # Nacos v3 入口脚本强制要求三项鉴权占位值（即使关闭鉴权）；值见 docker/.env.template
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请在 docker/.env 填写 NACOS_AUTH_TOKEN（32 字节以上字符串的 Base64）}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-buildcloud-identity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?请在 docker/.env 填写 NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "127.0.0.1:${NACOS_HTTP_HOST_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_GRPC_HOST_PORT:-9848}:9848"
      - "127.0.0.1:${NACOS_CONSOLE_HOST_PORT:-8080}:8080"
    volumes:
      - nacos-data:/home/nacos/data
    # 实测依据（2026-11-25）：512m 堆 + 堆外/metaspace，稳态占用 ~760MiB，768m 限额占 99%，
    # 有 OOM 风险，上调至 1024m（docs/ops/middleware-limits.md §5）
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8848 && </dev/tcp/127.0.0.1/9848"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ------------------------------------------------------------ RocketMQ --
  # RocketMQ 5.3.1：NameServer + Broker（事务消息/延迟消息，W4+ 使用）
  rocketmq-namesrv:
    # 经 docker/rocketmq/Dockerfile 补建 logs/store 目录并授权（镜像内未预建，见该文件注释）
    build:
      context: ./rocketmq
      dockerfile: Dockerfile
    image: buildcloud-rocketmq:5.3.1-local
    container_name: bc-rmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      <<: *tz
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    ports:
      - "127.0.0.1:${RMQ_NAMESRV_HOST_PORT:-9876}:9876"
    volumes:
      - namesrv-logs:/home/rocketmq/logs
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/9876"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  rocketmq-broker:
    # 同 namesrv：使用补建目录后的本地镜像（buildcloud-rocketmq:5.3.1-local）
    build:
      context: ./rocketmq
      dockerfile: Dockerfile
    image: buildcloud-rocketmq:5.3.1-local
    container_name: bc-rmq-broker
    restart: unless-stopped
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    environment:
      <<: *tz
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn128m -XX:MaxDirectMemorySize=128m"
    ports:
      - "127.0.0.1:${RMQ_BROKER_HOST_PORT:-10911}:10911"
    volumes:
      - type: bind
        source: ./rocketmq/conf/broker.conf
        target: /home/rocketmq/conf/broker.conf
        read_only: true
        bind:
          create_host_path: false
      - broker-store:/home/rocketmq/store
      - broker-logs:/home/rocketmq/logs
    mem_limit: 1024m
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/10911"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ------------------------------------------------------------- 辅助层 --
  # Seata Server 2.5.0（AT 模式）：本地 file 存储即可（undo_log 在业务库，W2/W3 落地）
  seata-server:
    image: apache/seata-server:2.5.0.jdk17
    container_name: bc-seata
    restart: unless-stopped
    environment:
      <<: *tz
      STORE_MODE: file
    ports:
      - "127.0.0.1:${SEATA_HOST_PORT:-8091}:8091"
      - "127.0.0.1:${SEATA_CONSOLE_HOST_PORT:-7091}:7091"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8091"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # XXL-Job-Admin 2.4.0：容器内 8080 → 宿主机 9090，与基座 application-dev.yaml
  # 的 http://127.0.0.1:9090/xxl-job-admin 对齐；建表 SQL 随 mysql 首次启动自动导入
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: bc-xxl-job-admin
    restart: unless-stopped
    environment:
      <<: *tz
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        --spring.datasource.username=${XXL_JOB_DB_USER:-xxl_job}
        --spring.datasource.password=${XXL_JOB_DB_PASSWORD:?请在 docker/.env 填写 XXL_JOB_DB_PASSWORD}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-default_token}
    ports:
      - "127.0.0.1:${XXL_JOB_HOST_PORT:-9090}:8080"
    mem_limit: 768m
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # MinIO：文件存储（基座默认对象存储）。
  # 2026-11-25 官方分发已停止匿名获取（Docker Hub 下架 / quay 401 / dl.min.io 410），
  # 经实测改用 bitnamilegacy/minio:latest（Bitnami 归档镜像，匿名可拉取，内置
  # MinIO DEVELOPMENT.2025-05-24 + mc + curl，S3 健康探针 200 实测通过）；
  # 镜像停留在归档版本，长期升级路径见 docs/ops/deploy-local.md §6。
  minio:
    image: bitnamilegacy/minio:latest
    container_name: bc-minio
    restart: unless-stopped
    # 数据卷由 Docker 创建为 root:root，镜像默认用户 1001 无写权限（2026-11-25 实测），
    # 本地开发中间件以 root 运行；如需非 root，可在宿主机 chown 1001 后移除本行
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      <<: *tz
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 docker/.env 填写 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 docker/.env 填写 MINIO_ROOT_PASSWORD（至少 8 位）}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    mem_limit: 512m
    healthcheck:
      # bitnami 镜像含 curl；S3 live 探针（2026-11-25 实测 200）
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # PostgreSQL 17 + pgvector：AI 模块向量库（W7 使用），与 MySQL 业务库相互独立
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: bc-postgres
    restart: unless-stopped
    environment:
      <<: *tz
      POSTGRES_USER: ${POSTGRES_USER:-buildcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 docker/.env 填写 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-buildcloud_ai}
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  namesrv-logs:
  broker-store:
  broker-logs:
  minio-data:
  pg-data:
