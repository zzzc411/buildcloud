# 筑云 BuildCloud — RocketMQ Broker 本地单机配置（W1 Phase 1）
# 挂载于 docker/middleware.yaml 的 rocketmq-broker 服务（/home/rocketmq/conf/broker.conf）

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# 本机开发拓扑：基座服务跑在宿主机（Phase 2 从源码启动），必须向 NameServer 上报
# 127.0.0.1，宿主机客户端才能连上 Broker（docker compose 官方 quickstart 的单机写法）。
# 若将来把服务也容器化，需改为服务名（如 rocketmq-broker）并调整端口映射。
brokerIP1 = 127.0.0.1
listenPort = 10911

# 与 compose 内的 NameServer 服务名对齐
namesrvAddr = rocketmq-namesrv:9876

# 存储与磁盘策略（本地开发：异步刷盘足够）
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
deleteWhen = 04
fileReservedTime = 48

# 本地开发便捷项：允许自动创建 Topic / 订阅组（W6 压测前再按需收敛）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 内存友好（16G 预算，见 docs/ops/middleware-limits.md）：关闭堆外暂存池
transientStorePoolEnable = false
