spring:
  application:
    name: gateway-server

  profiles:
    active: local

  http:
    codecs:
      max-in-memory-size: 10MB # 调整缓冲区大小https://gitee.com/zhijiantianya/yudao-cloud/pulls/176

  # Jackson 配置项
  jackson:
    serialization:
      write-dates-as-timestamps: true # 设置 LocalDateTime 的格式，使用时间戳
      write-date-timestamps-as-nanoseconds: false # 设置不使用 nanoseconds 的格式。例如说 1611460870.401，而是直接 1611460870401
      write-durations-as-timestamps: true # 设置 Duration 的格式，使用时间戳
      fail-on-empty-beans: false # 允许序列化无属性的 Bean

  main:
    allow-circular-references: true # 允许循环依赖，因为项目是三层架构，无法避免这个情况。

  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yaml # 加载【本地】配置
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml # 加载【Nacos】的配置

  cloud:
    # Spring Cloud Gateway 配置项，对应 GatewayProperties 类
    gateway:
      server:
        webflux:
          # 路由配置项，对应 RouteDefinition 数组
          routes:
            ## system-server 服务
            - id: system-admin-api # 路由的编号
              uri: grayLb://system-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/system/**
              filters:
                  - RewritePath=/admin-api/system/v3/api-docs, /v3/api-docs # 配置，保证转发到 /v3/api-docs
            - id: system-app-api # 路由的编号
              uri: grayLb://system-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/app-api/system/**
              filters:
                  - RewritePath=/app-api/system/v3/api-docs, /v3/api-docs
            ## infra-server 服务
            - id: infra-admin-api # 路由的编号
              uri: grayLb://infra-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/infra/**
              filters:
                  - RewritePath=/admin-api/infra/v3/api-docs, /v3/api-docs
            - id: infra-app-api # 路由的编号
              uri: grayLb://infra-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/app-api/infra/**
              filters:
                  - RewritePath=/app-api/infra/v3/api-docs, /v3/api-docs
            - id: infra-spring-boot-admin # 路由的编号（Spring Boot Admin）
              uri: grayLb://infra-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin/**
            - id: infra-websocket # 路由的编号（WebSocket）
              uri: grayLb://infra-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/infra/ws/**
            - id: infra-sse # 路由的编号（SSE）
              uri: grayLb://infra-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/infra/sse/**
            ## bpm-server 服务
            - id: bpm-admin-api # 路由的编号
              uri: grayLb://bpm-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/bpm/**
              filters:
                  - RewritePath=/admin-api/bpm/v3/api-docs, /v3/api-docs
            ## buildcloud 自研服务（W2 新增 4 个，端口 48084-48087）
            - id: buildcloud-project-admin-api # 路由的编号
              uri: grayLb://buildcloud-project-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/buildcloud-project/**
              filters:
                  - RewritePath=/admin-api/buildcloud-project/v3/api-docs, /v3/api-docs
            - id: buildcloud-material-admin-api # 路由的编号
              uri: grayLb://buildcloud-material-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/buildcloud-material/**
              filters:
                  - RewritePath=/admin-api/buildcloud-material/v3/api-docs, /v3/api-docs
            - id: buildcloud-report-admin-api # 路由的编号
              uri: grayLb://buildcloud-report-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/buildcloud-report/**
              filters:
                  - RewritePath=/admin-api/buildcloud-report/v3/api-docs, /v3/api-docs
            - id: buildcloud-ai-admin-api # 路由的编号
              uri: grayLb://buildcloud-ai-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/buildcloud-ai/**
              filters:
                  - RewritePath=/admin-api/buildcloud-ai/v3/api-docs, /v3/api-docs
          x-forwarded:
            prefix-enabled: false # 避免 Swagger 重复带上额外的 /admin-api/system 前缀
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin # 采用 https://github.com/spring-cloud/spring-cloud-gateway/pull/866 解决响应头重复问题

server:
  port: 48080

logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log # 日志文件名，全路径

knife4j:
  # 聚合 Swagger 文档，参考 https://doc.xiaominfo.com/docs/action/springcloud-gateway 文档
  gateway:
    enabled: true
    routes:
      - name: system-server
        service-name: system-server
        url: /admin-api/system/v3/api-docs
      - name: infra-server
        service-name: infra-server
        url: /admin-api/infra/v3/api-docs
      - name: bpm-server
        service-name: bpm-server
        url: /admin-api/bpm/v3/api-docs
      - name: buildcloud-project-server
        service-name: buildcloud-project-server
        url: /admin-api/buildcloud-project/v3/api-docs
      - name: buildcloud-material-server
        service-name: buildcloud-material-server
        url: /admin-api/buildcloud-material/v3/api-docs
      - name: buildcloud-report-server
        service-name: buildcloud-report-server
        url: /admin-api/buildcloud-report/v3/api-docs
      - name: buildcloud-ai-server
        service-name: buildcloud-ai-server
        url: /admin-api/buildcloud-ai/v3/api-docs

--- #################### 芋道相关配置 ####################

yudao:
  info:
    version: 1.0.0
